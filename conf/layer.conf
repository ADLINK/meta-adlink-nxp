# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_PRIORITY_adlink-nxp = "10"

BBFILE_COLLECTIONS += "adlink-nxp"
BBFILE_PATTERN_adlink-nxp := "^${LAYERDIR}"

LAYERDEPENDS_adlink-nxp = "adlink-demo"

LAYERSERIES_COMPAT_adlink-nxp = "kirkstone"

BBFILES_DYNAMIC += " \
    adlink-demo:${LAYERDIR}/dynamic-layers/meta-adlink-demo/*/*/*.bb \
    adlink-demo:${LAYERDIR}/dynamic-layers/meta-adlink-demo/*/*/*.bbappend \
    desktop-distro:${LAYERDIR}/dynamic-layers/meta-nxp-desktop/*/*/*.bb \
    desktop-distro:${LAYERDIR}/dynamic-layers/meta-nxp-desktop/*/*/*.bbappend \
"
