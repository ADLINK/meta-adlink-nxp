#machine configuration file for OSM-IMX8MP

MACHINEOVERRIDES =. "mx95:"

require conf/machine/include/imx95-evk.inc

# kernel
IMX_KERNEL_CONFIG_AARCH64:osm-imx95 = "osm-imx95_defconfig"

# The device tree name is implicit for LPDDR4, so can't use MACHINE here
KERNEL_DEVICETREE_BASENAME = "osm-imx95"
KERNEL_DEVICETREE = " \
		adlink/${KERNEL_DEVICETREE_BASENAME}.dtb \
		adlink/${KERNEL_DEVICETREE_BASENAME}-1588.dtb \ 
		adlink/${KERNEL_DEVICETREE_BASENAME}-1588-exclk.dtb \ 
		adlink/${KERNEL_DEVICETREE_BASENAME}-1588-exclk-0.dtb \ 
		adlink/${KERNEL_DEVICETREE_BASENAME}-1588-exclk-2.dtb  \
		adlink/${KERNEL_DEVICETREE_BASENAME}-1588-gpio.dtb \
		adlink/${KERNEL_DEVICETREE_BASENAME}-eb4.dtb \
		adlink/${KERNEL_DEVICETREE_BASENAME}-eb4-tpmch1.dtb \ 
		adlink/adlink-eb4-lt9611-lvds.dtb \ 
		adlink/adlink-eb4-lt9611.dtb \
		adlink/adlink-eb4-dsi.dtb \
"

# over device tree overlay
EXTRA_OEMAKE:append:pn-linux-imx = " DTC_FLAGS='-@ -H epapr'"

# kernel patches
EXTRA_KERNEL_PATCHES = " \
file://osm-imx95/osm-imx95_defconfig \
file://osm-imx95/0001-Added-Adlink-ADL1001-device-driver.patch \
file://osm-imx95/0002-Enable-mclk-from-device-tree.patch \
file://osm-imx95/0003-Added-lt9611-driver.patch \
file://osm-imx95/0004-Added-timings-parameters-for-g156hat026-panel.patch \
file://osm-imx95/0005-UART-Port-macro.patch \
file://osm-imx95/0006-Added-support-for-rtc-rx8130.patch \
file://osm-imx95/0007-Set-shutdown-for-scmi.patch \
file://osm-imx95/0008-Poweroff-handler-for-bbm.patch \
file://osm-imx95/0009-Add-clock-mode-rates.patch \
file://osm-imx95/0010-DMA-for-message-buffer-support.patch \
file://osm-imx95/0011-OV13855-kconfig-support.patch \
file://osm-imx95/0012-OV13855-makefile-support.patch \
file://osm-imx95/0013-OV13855-driver-file-support.patch \
file://osm-imx95/0014-Update-power-managerment-suspend-and-resume-function.patch \
file://osm-imx95/0015-Remove-IO-pci-virtulization.patch \
file://osm-imx95/0016-Add-LED-configuration.patch \
file://osm-imx95/0017-Update-MAC-list.patch \
file://osm-imx95/0018-Timer-Event-support.patch \
file://osm-imx95/0019-SCMI-shutdown-update.patch \
"

	
	
EXTRA_KERNEL_DTS = " \
		file://osm-imx95/${KERNEL_DEVICETREE_BASENAME}.dts \
		file://osm-imx95/${KERNEL_DEVICETREE_BASENAME}-1588.dts \ 
		file://osm-imx95/${KERNEL_DEVICETREE_BASENAME}-1588-exclk.dts \ 
		file://osm-imx95/${KERNEL_DEVICETREE_BASENAME}-1588-exclk-0.dts \ 
		file://osm-imx95/${KERNEL_DEVICETREE_BASENAME}-1588-exclk-2.dts  \
		file://osm-imx95/${KERNEL_DEVICETREE_BASENAME}-1588-gpio.dts \
		file://osm-imx95/${KERNEL_DEVICETREE_BASENAME}-eb4.dts \
		file://osm-imx95/${KERNEL_DEVICETREE_BASENAME}-eb4-tpmch1.dts \ 
		file://osm-imx95/adlink-eb4-lt9611-lvds.dts \ 
		file://osm-imx95/adlink-eb4-lt9611.dts \
		file://osm-imx95/adlink-eb4-dsi.dts \
		file://osm-imx95/lt9611-eb4.dts \
		file://osm-imx95/ov13855-eb4.dts \
		file://osm-imx95/g156hat02.6-eb4.dts \
		file://osm-imx95/g080uan02-eb4.dts \		
"

EXTRA_SRC_DTS = " \
	file://osm-imx95/imx95.dtsi \
	file://osm-imx95/imx95-pinfunc.h \
"	

KERNEL_SRC_PATCHES[osm-imx95] = " \
	${EXTRA_KERNEL_PATCHES} \
	${EXTRA_KERNEL_DTS} \
	${EXTRA_SRC_DTS} \
"
IMAGE_ROOTFS_EXTRA_SPACE:append = "${@bb.utils.contains('NEUTRON_SUPPORT', '1', ' + 10485760', '', d)}"

# u-boot
UBOOT_CONFIG_BASENAME = "osm-imx95"
UBOOT_DTB_NAME = "osm-imx95.dtb"
UBOOT_CONFIG = "sd"
UBOOT_CONFIG[sd] = "${UBOOT_CONFIG_BASENAME}_defconfig,sdcard"


# u-boot patches
EXTRA_UBOOT_PATCHES = " \
  file://osm-imx95/0001-Added-osm-imx95-Board-support.patch \
  file://osm-imx95/osm-imx95_defconfig \
"


EXTRA_UBOOT_DTS = " \
  file://osm-imx95/osm-imx95.dts \
  file://osm-imx95/imx95.dtsi \
  file://osm-imx95/osm-imx95-u-boot.dtsi \
"
UBOOT_SRC_PATCHES[osm-imx95] = " \
	${EXTRA_UBOOT_PATCHES} \
	${EXTRA_UBOOT_DTS} \
"

EXTRA_IMXBOOT_PATCHES = "file://osm-imx95/0001-Added-DDR-config-binary-into-Image.patch"
IMXBOOT_TARGETS_BASENAME = "flash"
OEI_BOARD  = "mx95lp4x-15"
DDR_TYPE   = "lpddr4x"
OEI_CONFIGS = "ddr tcm dat"

DDR_FIRMWARE_NAME = " \
    lpddr4x_dmem_qb_v202409.bin \
    lpddr4x_dmem_v202409.bin \
    lpddr4x_imem_qb_v202409.bin \
    lpddr4x_imem_v202409.bin \
"

#SYSTEM_MANAGER_CONFIG = "mx95lec"
M4_DEFAULT_IMAGE_MX95 = "${@bb.utils.contains('SYSTEM_MANAGER_CONFIG', 'mx95netc', 'imx95-19x19-evk_m7_TCM_netc_share.bin', \
                                                                                   'imx95-19x19-evk_m7_TCM_power_mode_switch.bin', d)}"

IMAGE_BOOT_FILES:append = " \
	mcore-demos/imx95-19x19-evk_m7_TCM_flexcan_linux.bin \
	mcore-demos/imx95-19x19-evk_m7_TCM_low_power_wakeword.bin \
	mcore-demos/imx95-19x19-evk_m7_TCM_netc_share.bin \
	mcore-demos/imx95-19x19-evk_m7_TCM_power_mode_switch.bin \
	mcore-demos/imx95-19x19-evk_m7_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
	mcore-demos/imx95-19x19-evk_m7_TCM_rpmsg_lite_str_echo_rtos.bin \
	mcore-demos/imx95-19x19-evk_m7_TCM_sai_low_power_audio.bin \
    ${@bb.utils.contains('COMBINED_FEATURES', 'xen', 'xen', '', d)} \
"
# wic
IMAGE_FSTYPES:append = " wic wic.md5sum"


