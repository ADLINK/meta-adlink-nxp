#@TYPE: Machine
#@NAME: NXP i.MX6Solo SABRE Smart Device
#@SOC: i.MX6S
#@DESCRIPTION: Machine configuration for NXP i.MX6Solo SABRE Smart Device
#@MAINTAINER: Otavio Salvador <otavio@ossystems.com.br>

MACHINEOVERRIDES =. "mx6:mx6dl:"

require conf/machine/include/imx6sabresd-common.inc

IMX_KERNEL_CONFIG:lec-imx61 = "lec_imx6_defconfig"
KBUILD_DEFCONFIG:lec-imx61 = "lec_imx6_defconfig"

KERNEL_DEVICETREE_BASENAME = "lec-imx6s"

KERNEL_DEVICETREE = " \
    adlink/${KERNEL_DEVICETREE_BASENAME}.dtb \
"

EXTRA_KERNEL_PATCHES =   " \
             file://lec-imx61/lec_imx6_defconfig \
             file://lec-imx61/0002-net-phy-at803x-support-tx-internal-delay-ps-for-the-.patch \
             file://lec-imx61/0004-PCI-imx6-power-the-i.MX6Q-PHY-up-again-on-core-reset.patch \
             "

EXTRA_KERNEL_DTS = "\
             file://lec-imx61/lec-imx6s.dts \
             file://lec-imx61/lec-imx6.dtsi \
"
KERNEL_SRC_PATCHES[lec-imx61] = " \
	${EXTRA_KERNEL_PATCHES} \
	${EXTRA_KERNEL_DTS} \
"

# U-Boot Configuration
UBOOT_CONFIG_BASENAME = "adlink_lec_imx6"

UBOOT_MACHINE = "${UBOOT_CONFIG_BASENAME}_s-1_defconfig"
UBOOT_DTB_NAME = "lec-imx6.dtb lec-imx6dl.dtb"

EXTRA_UBOOT_PATCHES = " \
  file://lec-imx61/adlink_lec_imx6_s-1_defconfig \
  file://lec-imx61/0001-Added-u-boot-board-support.patch \
"
EXTRA_UBOOT_DTS = " \
  file://lec-imx61/lec-imx6dl.dts \
  file://lec-imx61/lec-imx6.dts \
  file://lec-imx61/lec-imx6qdl.dtsi \
  file://lec-imx61/lec-imx6-u-boot.dtsi \
"

UBOOT_SRC_PATCHES[lec-imx61] = " \
        ${EXTRA_UBOOT_PATCHES} \
        ${EXTRA_UBOOT_DTS} \
"

KERNEL_IMAGETYPE = "zImage"

MACHINE_FEATURES:append = " optee"

