#machine configuration file for LEC-IMX95

MACHINEOVERRIDES =. "mx95:"

KBUILD_DEFCONFIG:lec-imx95 = "lec-imx95_defconfig"

require conf/machine/include/imx95-evk.inc


# kernel
IMX_KERNEL_CONFIG_AARCH64:lec-imx95 = "lec-imx95_defconfig"

# The device tree name is implicit for LPDDR4, so can't use MACHINE here
KERNEL_DEVICETREE_BASENAME = "lec-imx95"
KERNEL_DEVICETREE = " \
        adlink/${KERNEL_DEVICETREE_BASENAME}.dtb \
	adlink/${KERNEL_DEVICETREE_BASENAME}-cameras-lvds.dtb \
	adlink/${KERNEL_DEVICETREE_BASENAME}-lt9611.dtb \
	adlink/${KERNEL_DEVICETREE_BASENAME}-lt96114k.dtb \
	adlink/${KERNEL_DEVICETREE_BASENAME}-g080uan02.dtb \
	adlink/${KERNEL_DEVICETREE_BASENAME}-g156hat02.6.dtb \		
	adlink/${KERNEL_DEVICETREE_BASENAME}-ov5640.dtb \
	adlink/${KERNEL_DEVICETREE_BASENAME}-ov13855.dtb \		
	adlink/${KERNEL_DEVICETREE_BASENAME}-lt9611-pcie8997.dtb \
	adlink/${KERNEL_DEVICETREE_BASENAME}-ov13855-lvds.dtb \
	adlink/${KERNEL_DEVICETREE_BASENAME}-lt9611-noconsole.dtb \
	adlink/${KERNEL_DEVICETREE_BASENAME}-lt9611-uart2.dtb \
        adlink/${KERNEL_DEVICETREE_BASENAME}-lt9611-spi7.dtb \
	${@bb.utils.contains('NEUTRON_SUPPORT', '1', 'adlink/${KERNEL_DEVICETREE_BASENAME}-neutron.dtb', '', d)} \
"
# over device tree overlay
EXTRA_OEMAKE:append:pn-linux-imx = " DTC_FLAGS='-@ -H epapr'"

# kernel patches
EXTRA_KERNEL_PATCHES = " \
        file://lec-imx95/lec-imx95_defconfig \
        file://lec-imx95/0002-LEC-IMX95-Add-ADL1000-driver.patch \
        file://lec-imx95/0003-LEC-IMX95-Add-ADLINK-LT9611-driver.patch \
        file://lec-imx95/0004-LEC-IMX95-G156HAT026-and-audio-codec-support.patch \
"
EXTRA_KERNEL_DTS = " \
        file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}.dts  \
        file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-cameras-lvds.dts \
	file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-lt9611.dts \
	file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-lt96114k.dts \
	file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-g080uan02.dts \ 
	file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-g156hat02.6.dts \  	
	file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-ov5640.dts \ 
	file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-ov13855.dts \  
	file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-lt9611-pcie8997.dts \
	file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-ov13855-lvds.dts \
	file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-lt9611-noconsole.dts \
	file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-lt9611-uart2.dts \
	file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-uart2.dts \
        file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-lt9611-spi7.dts \
        ${@bb.utils.contains('NEUTRON_SUPPORT', '1', 'file://lec-imx95/${KERNEL_DEVICETREE_BASENAME}-neutron.dts', '', d)} \
"
EXTRA_SRC_DTS = " \
        file://lec-imx95/imx95.dtsi \
        file://lec-imx95/imx95-pinfunc.h \
        file://lec-imx95/imx95-clock.h \
        file://lec-imx95/imx95-power.h \
        file://lec-imx95/lt9611-basic.dtsi \
        file://lec-imx95/lt96114k-basic.dtsi \
        file://lec-imx95/ov5640-basic.dtsi \
	file://lec-imx95/ov13855-basic.dtsi \
	file://lec-imx95/g156hat02.6-basic.dtsi \
	file://lec-imx95/g080uan02-basic.dtsi \
"

KERNEL_SRC_PATCHES[lec-imx95] = " \
        ${EXTRA_KERNEL_PATCHES} \
        ${EXTRA_KERNEL_DTS} \
        ${EXTRA_SRC_DTS} \
"

#u-boot
UBOOT_CONFIG_BASENAME = "lec-imx95"

UBOOT_DTB_NAME = "lec-imx95.dtb"
UBOOT_CONFIG = "sd"
UBOOT_CONFIG[sd] = "${UBOOT_CONFIG_BASENAME}_defconfig,sdcard"

EXTRA_UBOOT_PATCHES = " \
  file://lec-imx95/lec-imx95_defconfig \
  file://lec-imx95/0001-Added-NXP-common-files.patch \
  file://lec-imx95/0002-Added-support-for-lec-imx95-platform.patch \
"
EXTRA_UBOOT_DTS = " \
  file://lec-imx95/lec-imx95.dts \
  file://lec-imx95/lec-imx95-u-boot.dtsi \
"
UBOOT_SRC_PATCHES[lec-imx95] = " \
        ${EXTRA_UBOOT_PATCHES} \
        ${EXTRA_UBOOT_DTS} \
"

EXTRA_IMXBOOT_PATCHES = "file://lec-imx95/0001-LEC-IMX95-Add-timing-data-configurations.patch"
IMXBOOT_TARGETS_BASENAME = "flash"
OEI_BOARD  = "mx95lp5"
DDR_TYPE   = "lpddr5"
DDR_FIRMWARE_NAME = " \
    lpddr5_dmem_v202409.bin \
    lpddr5_dmem_qb_v202409.bin \
    lpddr5_imem_v202409.bin \
    lpddr5_imem_qb_v202409.bin \
"

OEI_CONFIGS = "ddr tcm dat"

OEI_DDR_CONFIG     = "MIMX95_LPDDR5_EVK_19X19_6400MTS_FW2024.09_timing"
OEI_DDR_CONFIG_ECC = "MIMX95_LPDDR5_EVK_19X19_6400MTS_FW2024.09_ECC_enabled_timing"

M4_DEFAULT_IMAGE_MX95 = "${@bb.utils.contains('SYSTEM_MANAGER_CONFIG', 'mx95netc', 'imx95-19x19-evk_m7_TCM_netc_share.bin', \
                                                                                   'imx95-19x19-evk_m7_TCM_power_mode_switch.bin', d)}"


SYSTEM_MANAGER_CONFIG = "mx95lec"
IMAGE_FSTYPES:append = " wic wic.md5sum"

IMAGE_BOOT_FILES:append = " \
    mcore-demos/imx95-19x19-evk_m7_TCM_flexcan_linux.bin \
    mcore-demos/imx95-19x19-evk_m7_TCM_hello_world.bin \
    mcore-demos/imx95-19x19-evk_m7_TCM_netc_share.bin \
    mcore-demos/imx95-19x19-evk_m7_TCM_power_mode_switch.bin \
    mcore-demos/imx95-19x19-evk_m7_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    mcore-demos/imx95-19x19-evk_m7_TCM_rpmsg_lite_str_echo_rtos.bin \
    mcore-demos/imx95-19x19-evk_m7_TCM_sai_low_power_audio.bin \
    ${@bb.utils.contains('COMBINED_FEATURES', 'xen', 'xen', '', d)} \
"

#installation dependencies
MACHINE_EXTRA_RDEPENDS += " \
    firmware-nxp-wifi \
    tpm2-tss \
    libtss2-tcti-device \
    tpm2-tools \
"
