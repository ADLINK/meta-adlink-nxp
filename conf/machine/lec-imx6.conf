#@TYPE: Machine
#@NAME: NXP i.MX6Solo SABRE Smart Device
#@SOC: i.MX6S
#@DESCRIPTION: Machine configuration for NXP i.MX6Solo SABRE Smart Device
#@MAINTAINER: Otavio Salvador <otavio@ossystems.com.br>

MACHINEOVERRIDES =. "mx6:mx6dl:"

require conf/machine/include/imx6sabresd-common.inc

IMX_KERNEL_CONFIG_ARM:lec-imx6 = "lec_imx6_defconfig"
KBUILD_DEFCONFIG:lec-imx6 = "lec_imx6_defconfig"

KERNEL_DEVICETREE_BASENAME = "lec-imx6s"

KERNEL_DEVICETREE = " \
    adlink/${KERNEL_DEVICETREE_BASENAME}.dtb \
"

EXTRA_KERNEL_PATCHES = " \
               file://lec-imx6/lec_imx6_defconfig \
               file://lec-imx6/0001-Improve-SD-MMC-power-consumption-and-speed.patch \
               file://lec-imx6/0002-net-phy-at803x-support-tx-internal-delay-ps-for-the-.patch \
               file://lec-imx6/0003-Added-tlv320aic3c-codec-support.patch \
               file://lec-imx6/0004-PCI-imx6-power-the-i.MX6Q-PHY-up-again-on-core-reset.patch \
               file://lec-imx6/0005-Adapt-camera-interfaces.patch \
               file://lec-imx6/0006-Fix-suspend-to-RAM-issues.patch \
               file://lec-imx6/0008-optimize-compile-when-6Q-SL-SX-UL-7D-support-is-disa.patch \
               "

EXTRA_KERNEL_DTS = "\
               file://lec-imx6/lec-imx6s.dts \
               file://lec-imx6/lec-imx6.dtsi \
"
KERNEL_SRC_PATCHES[lec-imx6] = " \
        ${EXTRA_KERNEL_PATCHES} \
        ${EXTRA_KERNEL_DTS} \
"
# ==========================================
# U-Boot Configuration for i.MX6 (1GB vs 2GB)
# ==========================================
UBOOT_CONFIG_BASENAME = "adlink_lec_imx6"

# Conditionally select the defconfig based on memory size config
UBOOT_IMX6_DEFCONFIG = "${@bb.utils.contains('UBOOT_EXTRA_CONFIGS', 'LPDDR4_2GB', 'adlink_lec_imx6_s-2_defconfig', 'adlink_lec_imx6_s-1_defconfig', d)}"

# Define UBOOT_CONFIG cleanly using the dynamic variable
UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "${UBOOT_IMX6_DEFCONFIG}"

# Remove UBOOT_MACHINE entirely when using UBOOT_CONFIG
UBOOT_MACHINE = ""

UBOOT_DTB_NAME = "lec-imx6.dtb lec-imx6dl.dtb"

EXTRA_UBOOT_PATCHES = " \
  file://lec-imx6/adlink_lec_imx6_s-1_defconfig \
  file://lec-imx6/adlink_lec_imx6_s-2_defconfig \
  file://lec-imx6/0001-Added-u-boot-board-support.patch \
"

EXTRA_UBOOT_DTS = " \
  file://lec-imx6/lec-imx6dl.dts \
  file://lec-imx6/lec-imx6.dts \
  file://lec-imx6/lec-imx6qdl.dtsi \
  file://lec-imx6/lec-imx6-u-boot.dtsi \
"

UBOOT_SRC_PATCHES[lec-imx6] = " \
    ${EXTRA_UBOOT_PATCHES} \
    ${EXTRA_UBOOT_DTS} \
"

KERNEL_IMAGETYPE = "zImage"

MACHINE_FEATURES:append = " optee"
